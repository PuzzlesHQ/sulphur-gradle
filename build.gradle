plugins {
    id 'java'
    id 'java-gradle-plugin'
//    id "io.github.sgtsilvio.gradle.maven-central-publishing" version "0.4.0"
    id 'maven-publish'
}

group = 'dev.puzzleshq'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'PuzzlesHQ'
        url = 'https://maven.puzzleshq.dev/releases/'
    }
    gradlePluginPortal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of("21")
    }

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    implementation "dev.puzzleshq:gibberish-definer:${gibberish_definer_version}"
    implementation "net.fabricmc:mapping-io:0.8.0"

    implementation "dev.puzzleshq:lunar-config:1.0.2"

    implementation "org.ow2.asm:asm:${asm_version}"
    implementation "org.ow2.asm:asm-tree:${asm_version}"
    implementation "org.ow2.asm:asm-util:${asm_version}"
    implementation "org.ow2.asm:asm-analysis:${asm_version}"
    implementation "org.ow2.asm:asm-commons:${asm_version}"

    implementation "dev.puzzleshq:access-writer:1.0.4+c"
    implementation "dev.puzzleshq:mod-format-framework:1.0.0"
    implementation "org.hjson:hjson:3.1.0"

    implementation "com.gradleup.shadow:shadow-gradle-plugin:8.3.8"
    implementation 'com.google.code.gson:gson:2.15.0'
}

gradlePlugin {
    plugins {
        sulphur_plugin {
            id = 'sulphur'
            implementationClass = 'dev.puzzleshq.sulphur.SulphurPlugin'
        }
    }
}